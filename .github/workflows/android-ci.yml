name: Android CI / APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_card_pack:
        description: "기존 카드DB Release에서 Android용 카드 ZIP 생성"
        required: false
        type: boolean
        default: true
      run_emulator:
        description: "Android 에뮬레이터에 APK 설치 및 실행"
        required: false
        type: boolean
        default: true
      db_release_tag:
        description: "T 저장소의 정규화 SQLite DB Release tag"
        required: false
        type: string
        default: "fm1-carddb-29"

concurrency:
  group: fm-offline-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CARD_DB_RELEASE_TAG: ${{ inputs.db_release_tag || 'fm1-carddb-29' }}

    steps:
      - name: Checkout this APK repository
        uses: actions/checkout@v7

      - name: Record source revision
        run: echo "FM_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check JavaScript and run game rule tests
        run: |
          set -euo pipefail
          node --check app/src/main/assets/game/card-schema.js
          node --check app/src/main/assets/game/app.js
          node --check app/src/main/assets/game/rules.js
          node --check scripts/fm1-offline/validate-app-card-pack.cjs
          node --test tests/*.test.cjs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Firestore-to-Android converter
        run: |
          set -euo pipefail
          python -m py_compile scripts/fm1-offline/build-firestore-card-pack.py scripts/fm1-offline/audit-enchant-cards.py
          python scripts/fm1-offline/build-firestore-card-pack.py --self-test
          python -m unittest tests/test_sqlite_card_pack.py
          python scripts/fm1-offline/audit-enchant-cards.py --self-test

      - name: Download the audited T SQLite DB release and build Android data ZIP
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_card_pack == true) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build-card-pack]') || contains(github.event.head_commit.message, '[run-emulator]'))) }}
        env:
          CARD_DB_RELEASE: https://github.com/dragonslayers-k/T/releases/download/${{ env.CARD_DB_RELEASE_TAG }}
          SOURCE_DIR: ${{ runner.temp }}/fm1-source
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fm1-source" release-package
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            "$CARD_DB_RELEASE/fm1_cards.sqlite.gz" -o "$RUNNER_TEMP/fm1-source/fm1_cards.sqlite.gz"
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            "$CARD_DB_RELEASE/sqlite-build-summary.json" -o "$RUNNER_TEMP/fm1-source/sqlite-build-summary.json"
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            "$CARD_DB_RELEASE/enumtable.json" -o "$RUNNER_TEMP/fm1-source/enumtable.json"
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            "$CARD_DB_RELEASE/images.tar.gz.part-aa" -o "$RUNNER_TEMP/fm1-source/images.tar.gz.part-aa"
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            "$CARD_DB_RELEASE/fm1-skill-catalog-v1.json" -o "$RUNNER_TEMP/fm1-source/fm1-skill-catalog-v1.json"
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dragonslayers-k/T/releases/tags/$CARD_DB_RELEASE_TAG" \
            -o "$RUNNER_TEMP/fm1-source/release-metadata.json"

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["SOURCE_DIR"])
          summary=json.loads((root/"sqlite-build-summary.json").read_text(encoding="utf-8"))
          release=json.loads((root/"release-metadata.json").read_text(encoding="utf-8"))
          assets={x["name"]:str(x.get("digest") or "") for x in release.get("assets",[])}
          checks=[
              ("fm1_cards.sqlite.gz", summary.get("sqliteGzipSha256")),
              ("enumtable.json", summary.get("enumtableSha256")),
              ("images.tar.gz.part-aa", summary.get("imageArchivePartAaSha256")),
              ("fm1-skill-catalog-v1.json", assets.get("fm1-skill-catalog-v1.json","").removeprefix("sha256:")),
          ]
          for filename, expected in checks:
              actual=hashlib.sha256((root/filename).read_bytes()).hexdigest()
              if not expected or actual.lower()!=str(expected).lower():
                  raise SystemExit(f"Source release asset hash mismatch: {filename}: {actual} != {expected}")
          if release.get("tag_name")!=os.environ["CARD_DB_RELEASE_TAG"]:
              raise SystemExit("Downloaded release metadata tag does not match selected DB release")
          if summary.get("integrity")!="ok" or summary.get("cards")!=15350:
              raise SystemExit("T SQLite summary does not describe the audited 15,350-card DB")
          if summary.get("archiveVerifiedImages")!=30700 or summary.get("foreignKeyErrors")!=0:
              raise SystemExit("T SQLite release summary is not fully image/FK verified")
          print(json.dumps({k:summary.get(k) for k in (
              "cards","categories","archiveVerifiedImages","hybridMappingReview",
              "specialSemanticsReview","effectCandidateRows","effectClauseRows"
          )},ensure_ascii=False))
          PY

          gzip -t "$RUNNER_TEMP/fm1-source/fm1_cards.sqlite.gz"
          gzip -dc "$RUNNER_TEMP/fm1-source/fm1_cards.sqlite.gz" > "$RUNNER_TEMP/fm1-source/fm1_cards.sqlite"
          python - "$RUNNER_TEMP/fm1-source/fm1_cards.sqlite" <<'PY'
          import hashlib, json, sqlite3, sys
          from pathlib import Path
          db_path=Path(sys.argv[1])
          summary_path=db_path.parent/"sqlite-build-summary.json"
          summary=json.loads(summary_path.read_text(encoding="utf-8"))
          actual_sha=hashlib.sha256(db_path.read_bytes()).hexdigest()
          if actual_sha.lower()!=str(summary.get("sqliteDatabaseSha256","")).lower():
              raise SystemExit("Uncompressed SQLite SHA-256 does not match T release manifest")
          db=sqlite3.connect(db_path)
          result=db.execute("PRAGMA integrity_check").fetchone()[0]
          if result!="ok": raise SystemExit("Downloaded normalized DB failed SQLite integrity_check: "+result)
          if db.execute("select count(*) from cards").fetchone()[0]!=15350: raise SystemExit("Unexpected SQLite card count")
          if db.execute("select count(*) from card_effect_candidate_summaries").fetchone()[0]!=17407: raise SystemExit("Missing card effect candidate rows")
          if db.execute("select count(*) from card_effect_clauses").fetchone()[0]!=48281: raise SystemExit("Missing effect clause source spans")
          if db.execute("select count(*) from game_rule_catalog where source_authority='manual'").fetchone()[0]!=27: raise SystemExit("Manual skill catalogue count mismatch")
          if db.execute("select count(*) from game_rule_catalog where source_authority='community'").fetchone()[0]!=41: raise SystemExit("Community candidate catalogue count mismatch")
          if db.execute("select count(*) from card_rule_mappings").fetchone()[0]<15000: raise SystemExit("Insufficient source card skill mappings")
          if db.execute("select count(*) from card_rule_mappings where mapping_status='manual_verified'").fetchone()[0]<1000: raise SystemExit("Insufficient Manual-verified card skills")
          if db.execute("select count(*) from card_rule_mappings where mapping_status='community_documented_candidate'").fetchone()[0]<100: raise SystemExit("Community skill candidate mappings missing")
          if db.execute("select count(*) from game_rule_catalog where source_authority='community' and playable_by_default=1").fetchone()[0]!=0: raise SystemExit("Community-only skill marked executable")
          print("Audited T SQLite DB29 + source-versioned skill catalogue: PASS")
          PY

          cat "$RUNNER_TEMP"/fm1-source/images.tar.gz.part-* > "$RUNNER_TEMP/fm1-source/images.tar.gz"
          tar -tzf "$RUNNER_TEMP/fm1-source/images.tar.gz" >/dev/null

          python scripts/fm1-offline/build-firestore-card-pack.py \
            --db-sqlite "$RUNNER_TEMP/fm1-source/fm1_cards.sqlite" \
            --db-release-tag "$CARD_DB_RELEASE_TAG" \
            --skill-catalogue "$RUNNER_TEMP/fm1-source/fm1-skill-catalog-v1.json" \
            --enumtable "$RUNNER_TEMP/fm1-source/enumtable.json" \
            --images-tar-gz "$RUNNER_TEMP/fm1-source/images.tar.gz" \
            --output "$RUNNER_TEMP/fm1-pack" \
            --zip-output "release-package/FM1-CardData-v1.3.0.zip"

          test -s release-package/FM1-CardData-v1.3.0.zip
          python scripts/fm1-offline/audit-enchant-cards.py \
            --cards-json "$RUNNER_TEMP/fm1-pack/cards.json" \
            --summary "release-package/enchant-effect-audit.json" \
            --csv "release-package/enchant-effect-audit.csv"
          unzip -p release-package/FM1-CardData-v1.3.0.zip cards.json > "$RUNNER_TEMP/fm1-app-cards.json"
          unzip -p release-package/FM1-CardData-v1.3.0.zip card-skill-mappings.json > "$RUNNER_TEMP/fm1-app-skill-mappings.json"
          unzip -p release-package/FM1-CardData-v1.3.0.zip card-effect-candidates.json > "$RUNNER_TEMP/fm1-app-effect-candidates.json"
          unzip -p release-package/FM1-CardData-v1.3.0.zip skill2-catalogue.json > "$RUNNER_TEMP/fm1-app-skill2-catalogue.json"
          node scripts/fm1-offline/validate-app-card-pack.cjs "$RUNNER_TEMP/fm1-app-cards.json" "$RUNNER_TEMP/fm1-app-skill-mappings.json" "$RUNNER_TEMP/fm1-app-effect-candidates.json" "$RUNNER_TEMP/fm1-app-skill2-catalogue.json"
          rm -f "$RUNNER_TEMP/fm1-app-cards.json" "$RUNNER_TEMP/fm1-app-skill-mappings.json" "$RUNNER_TEMP/fm1-app-effect-candidates.json" "$RUNNER_TEMP/fm1-app-skill2-catalogue.json"
          rm -rf "$RUNNER_TEMP/fm1-pack" "$RUNNER_TEMP/fm1-source"
          echo "FM1_DATA_PACK_STATUS=built-from-$CARD_DB_RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Android emulator components
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_emulator == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-emulator]')) }}
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Prepare optional release signing
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/fm-offline-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::notice::Signing secrets are not all configured; only Debug APK will be produced."
          fi

      - name: Build Debug APK and optional signed Release APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk FantasyMastersOffline-debug.apk
          test -s FantasyMastersOffline-debug.apk

          RELEASE_STATUS="not-configured"
          if [ "${RELEASE_SIGNING_AVAILABLE:-false}" = "true" ]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk FantasyMastersOffline-release.apk
            test -s FantasyMastersOffline-release.apk
            RELEASE_STATUS="signed"
          fi
          echo "RELEASE_APK_STATUS=$RELEASE_STATUS" >> "$GITHUB_ENV"

      - name: Verify APK application IDs, signatures and ZIP integrity
        run: |
          set -euo pipefail
          for APK in FantasyMastersOffline-debug.apk FantasyMastersOffline-release.apk; do
            [ -s "$APK" ] || continue
            BADGING="$RUNNER_TEMP/$(basename "$APK").badging.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$BADGING"
            if [[ "$APK" == *-debug.apk ]]; then
              grep -q "package: name='com.fantasy.offline.debug'" "$BADGING"
            else
              grep -q "package: name='com.fantasy.offline'" "$BADGING"
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
            fi
            unzip -tq "$APK"
          done

      - name: Install and launch APK in Android emulator
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_emulator == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-emulator]')) }}
        id: emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -memory 4096
          # This action runs each script line in a separate shell. Keep the
          # multiline smoke test in a checked-in script and invoke it as one command.
          script: bash scripts/fm1-offline/emulator-smoke-test.sh

      - name: Prepare build report and output files
        if: always()
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
        run: |
          set -euo pipefail
          mkdir -p release-package
          [ ! -s FantasyMastersOffline-debug.apk ] || cp FantasyMastersOffline-debug.apk release-package/
          [ ! -s FantasyMastersOffline-release.apk ] || cp FantasyMastersOffline-release.apk release-package/
          [ ! -s emulator-screen.png ] || cp emulator-screen.png release-package/
          [ ! -s emulator-launch-log.txt ] || cp emulator-launch-log.txt release-package/
          {
            echo "Project: Fantasy Masters Offline"
            echo "APK repository: $GITHUB_REPOSITORY"
            echo "Source commit: ${FM_SOURCE_COMMIT:-$GITHUB_SHA}"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Job status: ${{ job.status }}"
            echo "Signed release APK: ${RELEASE_APK_STATUS:-not-configured}"
            echo "Emulator installation/launch: ${EMULATOR_OUTCOME:-not-run}"
            echo "Android card ZIP: ${FM1_DATA_PACK_STATUS:-not-built-in-this-run}"
            echo "Source DB release: https://github.com/dragonslayers-k/T/releases/tag/${CARD_DB_RELEASE_TAG}"
            echo "Data pack version: FM1-CARD-DATA 1.3.0"
            echo "Card counts: Land 289 / Unit 8633 / Magic 3857 / Item 1748 / Enchant 823"
            echo "Unknown or mixed costs are not treated as free."
          } > release-package/build-status.txt

      - name: Upload standalone Android card data ZIP
        if: always() && hashFiles('release-package/FM1-CardData-v1.3.0.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: FM1-CardData-v1.3.0-DB29
          path: release-package/FM1-CardData-v1.3.0.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload APK and build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FantasyMastersOffline-build-output
          path: |
            release-package/FantasyMastersOffline-debug.apk
            release-package/FantasyMastersOffline-release.apk
            release-package/build-status.txt
            release-package/enchant-effect-audit.json
            release-package/enchant-effect-audit.csv
            release-package/emulator-screen.png
            release-package/emulator-launch-log.txt
            emulator-launch-logcat-full.txt
            emulator-process-exit-info.txt
            emulator-app-meminfo.txt
            emulator-system-meminfo.txt
            emulator-tombstone-list.txt
            emulator-tombstone_*.txt
          if-no-files-found: warn
          compression-level: 1
          retention-days: 90
