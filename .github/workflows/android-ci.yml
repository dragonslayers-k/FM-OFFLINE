name: Android CI / APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_card_pack:
        description: "기존 카드DB Release에서 Android용 카드 ZIP 생성"
        required: false
        type: boolean
        default: true
      run_emulator:
        description: "Android 에뮬레이터에 APK 설치 및 실행"
        required: false
        type: boolean
        default: false

concurrency:
  group: fm-offline-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout this APK repository
        uses: actions/checkout@v7

      - name: Record source revision
        run: echo "FM_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check JavaScript and run game rule tests
        run: |
          set -euo pipefail
          node --check app/src/main/assets/game/card-schema.js
          node --check app/src/main/assets/game/app.js
          node --check app/src/main/assets/game/rules.js
          node --test tests/*.test.cjs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Inspect source soul-production enum and land data
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'inspect-source-fields') }}
        env:
          CARD_DB_RELEASE: https://github.com/dragonslayers-k/T/releases/download/fm1-carddb-27
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fm1-inspect"
          curl --fail --location --retry 3 "$CARD_DB_RELEASE/cards.jsonl.gz" -o "$RUNNER_TEMP/fm1-inspect/cards.jsonl.gz"
          curl --fail --location --retry 3 "$CARD_DB_RELEASE/enumtable.json" -o "$RUNNER_TEMP/fm1-inspect/enumtable.json"
          python scripts/fm1-offline/inspect-source-fields.py "$RUNNER_TEMP/fm1-inspect/cards.jsonl.gz" "$RUNNER_TEMP/fm1-inspect/enumtable.json"

      - name: Check Firestore-to-Android converter
        run: |
          set -euo pipefail
          python -m py_compile scripts/fm1-offline/build-firestore-card-pack.py
          python scripts/fm1-offline/build-firestore-card-pack.py --self-test

      - name: Download the existing card DB release and build Android data ZIP
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_card_pack == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-card-pack]')) }}
        env:
          CARD_DB_RELEASE: https://github.com/dragonslayers-k/T/releases/download/fm1-carddb-27
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fm1-source" release-package
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            "$CARD_DB_RELEASE/cards.jsonl.gz" -o "$RUNNER_TEMP/fm1-source/cards.jsonl.gz"
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            "$CARD_DB_RELEASE/enumtable.json" -o "$RUNNER_TEMP/fm1-source/enumtable.json"
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            "$CARD_DB_RELEASE/images.tar.gz.part-aa" -o "$RUNNER_TEMP/fm1-source/images.tar.gz.part-aa"

          echo "ab1ea5b849d11a5b8491abfbed77aa782ca5f6379d33d1e6da9f467e73f80df9  $RUNNER_TEMP/fm1-source/cards.jsonl.gz" | sha256sum --check
          echo "c2dee3748d592679f707c160b37ccc4c3c489d849a69df198675da46e13aac48  $RUNNER_TEMP/fm1-source/enumtable.json" | sha256sum --check
          echo "009a8ddcea280bd14a794541d82cc81f95a9a62caf9a3d0ed1f14fcc1baf486e  $RUNNER_TEMP/fm1-source/images.tar.gz.part-aa" | sha256sum --check

          cat "$RUNNER_TEMP"/fm1-source/images.tar.gz.part-* > "$RUNNER_TEMP/fm1-source/images.tar.gz"
          tar -tzf "$RUNNER_TEMP/fm1-source/images.tar.gz" >/dev/null

          python scripts/fm1-offline/build-firestore-card-pack.py \
            --cards-jsonl-gz "$RUNNER_TEMP/fm1-source/cards.jsonl.gz" \
            --enumtable "$RUNNER_TEMP/fm1-source/enumtable.json" \
            --images-tar-gz "$RUNNER_TEMP/fm1-source/images.tar.gz" \
            --output "$RUNNER_TEMP/fm1-pack" \
            --zip-output "release-package/FM1-CardData-v1.1.2.zip"

          test -s release-package/FM1-CardData-v1.1.2.zip
          unzip -p release-package/FM1-CardData-v1.1.2.zip cards.json > "$RUNNER_TEMP/fm1-app-cards.json"
          node scripts/fm1-offline/validate-app-card-pack.cjs "$RUNNER_TEMP/fm1-app-cards.json"
          rm -f "$RUNNER_TEMP/fm1-app-cards.json"
          rm -rf "$RUNNER_TEMP/fm1-pack" "$RUNNER_TEMP/fm1-source"
          echo "FM1_DATA_PACK_STATUS=built-from-fm1-carddb-27" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Android emulator components
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_emulator == true }}
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Prepare optional release signing
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/fm-offline-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::notice::Signing secrets are not all configured; only Debug APK will be produced."
          fi

      - name: Build Debug APK and optional signed Release APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk FantasyMastersOffline-debug.apk
          test -s FantasyMastersOffline-debug.apk

          RELEASE_STATUS="not-configured"
          if [ "${RELEASE_SIGNING_AVAILABLE:-false}" = "true" ]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk FantasyMastersOffline-release.apk
            test -s FantasyMastersOffline-release.apk
            RELEASE_STATUS="signed"
          fi
          echo "RELEASE_APK_STATUS=$RELEASE_STATUS" >> "$GITHUB_ENV"

      - name: Verify APK application IDs, signatures and ZIP integrity
        run: |
          set -euo pipefail
          for APK in FantasyMastersOffline-debug.apk FantasyMastersOffline-release.apk; do
            [ -s "$APK" ] || continue
            BADGING="$RUNNER_TEMP/$(basename "$APK").badging.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$BADGING"
            if [[ "$APK" == *-debug.apk ]]; then
              grep -q "package: name='com.fantasy.offline.debug'" "$BADGING"
            else
              grep -q "package: name='com.fantasy.offline'" "$BADGING"
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
            fi
            unzip -tq "$APK"
          done

      - name: Install and launch APK in Android emulator
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_emulator == true }}
        id: emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: |
            set -euo pipefail
            if [ -s FantasyMastersOffline-release.apk ]; then
              APK="FantasyMastersOffline-release.apk"
              APP_ID="com.fantasy.offline"
            else
              APK="FantasyMastersOffline-debug.apk"
              APP_ID="com.fantasy.offline.debug"
            fi
            adb logcat -c
            adb install -r "$APK"
            adb shell am force-stop "$APP_ID"
            adb shell am start -W -n "$APP_ID/com.fantasy.offline.MainActivity"
            sleep 5
            APP_PID="$(adb shell pidof "$APP_ID" | tr -d '\r\n')"
            if [ -z "$APP_PID" ]; then
              echo "::error::Application process exited after launch"
              adb logcat -d -s AndroidRuntime:E ActivityManager:E
              exit 1
            fi
            adb exec-out screencap -p > emulator-screen.png
            test -s emulator-screen.png
            adb logcat -d -s AndroidRuntime:E ActivityManager:E > emulator-launch-log.txt || true

      - name: Prepare build report and output files
        if: always()
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
        run: |
          set -euo pipefail
          mkdir -p release-package
          [ ! -s FantasyMastersOffline-debug.apk ] || cp FantasyMastersOffline-debug.apk release-package/
          [ ! -s FantasyMastersOffline-release.apk ] || cp FantasyMastersOffline-release.apk release-package/
          [ ! -s emulator-screen.png ] || cp emulator-screen.png release-package/
          [ ! -s emulator-launch-log.txt ] || cp emulator-launch-log.txt release-package/
          {
            echo "Project: Fantasy Masters Offline"
            echo "APK repository: $GITHUB_REPOSITORY"
            echo "Source commit: ${FM_SOURCE_COMMIT:-$GITHUB_SHA}"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Job status: ${{ job.status }}"
            echo "Signed release APK: ${RELEASE_APK_STATUS:-not-configured}"
            echo "Emulator installation/launch: ${EMULATOR_OUTCOME:-not-run}"
            echo "Android card ZIP: ${FM1_DATA_PACK_STATUS:-not-built-in-this-run}"
            echo "Source DB release: https://github.com/dragonslayers-k/T/releases/tag/fm1-carddb-26"
            echo "Card counts: Land 289 / Unit 8633 / Magic 3857 / Item 1748 / Enchant 823"
            echo "Unknown or mixed costs are not treated as free."
          } > release-package/build-status.txt

      - name: Upload APK and optional Android data ZIP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FantasyMastersOffline-build-output
          path: release-package/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 90
